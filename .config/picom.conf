shadow = true;
shadow-opacity = 0.80;
shadow-color = "#000000";
shadow-radius = 17;
shadow-offset-x = -15;
shadow-offset-y = -15;

fading = true;
fade-in-step = 0.02;
fade-out-step = 0.04;

# GENERAL
backend = "glx";
vsync = true;
use-ewmh-active-win = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";
dbe = true;

# corner-radius = 5;
animations = ({
	triggers = [ "close", "hide" ];
	preset = "disappear";
	scale = 0.5;
	duration = 0.3;
})

rules: (
  {
    match = "class_g = 'dmenu'";
    animations = (
      {
        triggers = ["open", "show"];
        preset = "fly-in";
        # scale = 0.8;
        duration = 0.1;
      },
      {
        triggers = ["close", "hide"];
        preset = "fly-out";
        direction = "up";
        duration = 0.1;
      }
    );
  }
)